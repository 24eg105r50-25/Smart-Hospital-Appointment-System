<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Appointment Confirmation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f5f9;
            text-align: center;
            padding: 40px 15px;
        }

        .card {
            max-width: 500px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000015;
        }

        h1 {
            color: #087f8c;
        }

        .details {
            text-align: left;
            line-height: 2;
            margin: 25px 0;
        }

        a {
            display: inline-block;
            background: #087f8c;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>🎉 Appointment Submitted!</h1>

    <p>Your appointment details are shown below.</p>

    <div class="details">
        <p><strong>Patient Name:</strong> <span th:text="${patientName}"></span></p>
        <p><strong>Doctor:</strong> <span th:text="${doctor}"></span></p>
        <p><strong>Date:</strong> <span th:text="${date}"></span></p>
        <p><strong>Time:</strong> <span th:text="${time}"></span></p>
    </div>

    <p>This is a submission confirmation, not a persisted booking.</p>

    <a href="/dashboard">Back to Dashboard</a>

</div>

</body>
</html>
